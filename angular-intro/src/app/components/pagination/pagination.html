<div class="pagination">
    <div class="pagination-navigation">
        <button
            type="button"
            [disabled]="page <= 1"
            (click)="first()"
        >
            {{ firstText }}
        </button>

        <button
            type="button"
            [disabled]="page <= 1"
            (click)="prev()"
        >
            {{ prevText }}
        </button>

        <span>
            {{ pageText }}
            {{ page }}
            /
            {{ totalPages }}
        </span>

        <button
            type="button"
            [disabled]="page >= totalPages"
            (click)="next()"
        >
            {{ nextText }}
        </button>

        <button
            type="button"
            [disabled]="page >= totalPages"
            (click)="last()"
        >
            {{ lastText }}
        </button>
    </div>

    <label class="per-page">
        <span>
            {{ showText }}
        </span>

        <select
            [value]="perPage"
            (change)="changePerPage($event)"
        >
            <option
                *ngFor="let number of perPageOptions"
                [value]="number"
                [selected]="number === perPage"
            >
                {{ number }}
            </option>
        </select>
    </label>
</div>
