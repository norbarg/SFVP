<div class="pagination">
    <div class="pagination-navigation">
        <button
            type="button"
            [disabled]="page <= 1"
            (click)="first()"
        >
            First
        </button>

        <button
            type="button"
            [disabled]="page <= 1"
            (click)="prev()"
        >
            Prev
        </button>

        <span>
            Page {{ page }} / {{ totalPages }}
        </span>

        <button
            type="button"
            [disabled]="page >= totalPages"
            (click)="next()"
        >
            Next
        </button>

        <button
            type="button"
            [disabled]="page >= totalPages"
            (click)="last()"
        >
            Last
        </button>
    </div>

    <label class="per-page">
        <span>Show</span>

        <select
            [value]="perPage"
            (change)="changePerPage($event)"
        >
            <option
                *ngFor="let number of perPageOptions"
                [value]="number"
            >
                {{ number }}
            </option>
        </select>
    </label>
</div>
